<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Учёт">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Учёт расходов и доходов</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="topbar">
      <h1>💰 Учёт</h1>
      <div class="tools">
        <button type="button" id="export" class="ghost">Экспорт</button>
        <label class="btn ghost">Импорт<input type="file" id="import" accept="application/json" hidden></label>
      </div>
    </header>

    <nav class="seg">
      <button type="button" data-kind="expense" class="active">Расходы</button>
      <button type="button" data-kind="income">Доходы</button>
      <button type="button" data-view="deferred">Отложенное</button>
    </nav>
    <nav class="seg">
      <button type="button" data-period="day">День</button>
      <button type="button" data-period="week">Неделя</button>
      <button type="button" data-period="month" class="active">Месяц</button>
      <button type="button" data-period="year">Год</button>
    </nav>
    <div class="toolbar">
      <input type="date" id="anchor" aria-label="Дата периода">
    </div>

    <section class="panel summary">
      <div id="donut" class="donut"><div class="dtotal"><span id="total">0</span><img class="byn" src="byn-sign.png" alt="BYN"></div></div>
      <div class="cols">
        <div class="col" data-col="income">
          <h3><span>Доходы</span><strong id="income" class="income">0</strong></h3>
          <ul id="incomeCats" class="cats"></ul>
        </div>
        <div class="col" data-col="expense">
          <h3><span>Расходы</span><strong id="expense" class="expense">0</strong></h3>
          <ul id="expenseCats" class="cats"></ul>
        </div>
      </div>
    </section>

    <section class="cards">
      <div class="card"><span>Баланс</span><strong id="balance">0</strong></div>
    </section>

    <section class="panel">
      <h2 id="listTitle">Записи</h2>
      <ul id="list" class="list"></ul>
    </section>

    <section class="panel" id="formPanel">
      <h2 id="formTitle">Новая запись</h2>
      <form id="dform" class="form" hidden>
        <input id="dname" placeholder="Что хочу купить" required>
        <input id="damount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="Сумма" required>
        <input id="dnote" placeholder="Комментарий">
        <button type="submit">Добавить в отложенное</button>
      </form>
      <form id="form" class="form">
        <div class="seg ftabs">
          <button type="button" data-type="expense" class="active">Расходы</button>
          <button type="button" data-type="income">Доходы</button>
        </div>
        <select id="type" hidden>
          <option value="expense">Расход</option>
          <option value="income">Доход</option>
        </select>
        <input id="amount" type="number" inputmode="decimal" min="0.01" step="0.01" placeholder="Сумма" required>
        <div class="pickgrid">
          <button type="button" class="pick" data-cat="Еда"><span>🍽️</span>Еда</button>
          <button type="button" class="pick" data-cat="Покупки"><span>🛍️</span>Покупки</button>
          <button type="button" class="pick" data-cat="Транспорт"><span>🚌</span>Транспорт</button>
          <button type="button" class="pick" data-cat="Дом"><span>🏠</span>Дом</button>
          <button type="button" class="pick" data-cat="Кафе"><span>☕</span>Кафе</button>
          <button type="button" class="pick" data-cat="Здоровье"><span>💊</span>Здоровье</button>
          <button type="button" class="pick" data-cat="Подарок"><span>🎁</span>Подарок</button>
          <button type="button" class="pick" data-cat="Другое"><span>➕</span>Другое</button>
        </div>
        <input id="category" list="categories" placeholder="Категория" required>
        <datalist id="categories"></datalist>
        <input id="date" type="date" required>
        <input id="note" placeholder="Комментарий">
        <button type="submit">Добавить</button>
      </form>
    </section>
  </main>
  <button type="button" id="fab" class="fab" title="Добавить запись">+</button>
  <script src="script.js"></script>
</body>
</html>
