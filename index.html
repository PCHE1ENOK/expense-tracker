<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Финансовый трекер</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="topbar">
      <h1>💰 Финансовый трекер</h1>
      <label>Месяц <input type="month" id="month"></label>
      <div class="tools">
        <button type="button" id="export" class="ghost">Экспорт</button>
        <label class="btn ghost">Импорт<input type="file" id="import" accept="application/json" hidden></label>
      </div>
    </header>

    <section class="cards">
      <div class="card"><span>Доходы</span><strong id="income" class="income">0</strong></div>
      <div class="card"><span>Расходы</span><strong id="expense" class="expense">0</strong></div>
      <div class="card"><span>Баланс</span><strong id="balance">0</strong></div>
    </section>

    <section class="panel">
      <h2>Новая запись</h2>
      <form id="form" class="form">
        <select id="type">
          <option value="expense">Расход</option>
          <option value="income">Доход</option>
        </select>
        <input id="amount" type="number" min="0.01" step="0.01" placeholder="Сумма" required>
        <input id="category" list="categories" placeholder="Категория" required>
        <datalist id="categories"></datalist>
        <input id="date" type="date" required>
        <input id="note" placeholder="Комментарий">
        <button type="submit">Добавить</button>
      </form>
    </section>

    <div class="grid">
      <section class="panel">
        <h2>Больше всего потрачено</h2>
        <ul id="top" class="bars"></ul>
      </section>
      <section class="panel">
        <h2>Записи за месяц</h2>
        <ul id="list" class="list"></ul>
      </section>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
